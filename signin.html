<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in | Trackspave</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body class="account-page">
  <main class="account-card">
    <a class="brand" href="index.html"><span class="brand-icon">P</span>Trackspave</a>
    <p class="eyebrow">APP PREVIEW</p>
    <h1>Welcome back</h1>
    <p class="intro">Sign in to explore the Trackspave preview.</p>

    <form class="demo-form">
      <label for="email">Email</label>
      <input id="email" type="email" placeholder="you@example.com" required>

      <label for="password">Password</label>
      <input id="password" type="password" placeholder="Your password" required>

      <button class="text-button" type="button" data-demo-message>Forgot password?</button>
      <button class="button full-button" type="submit">Sign in</button>
      <p class="form-message" role="status"></p>
    </form>

    <p class="account-switch">New to Trackspave? <a href="get-started.html">Create an account</a></p>
    <p class="disclaimer">Preview only. This form does not create an account or send your details.</p>
  </main>
</body>
</html>
