<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create an account | Trackspave</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body class="account-page">
  <main class="account-card">
    <a class="brand" href="index.html"><span class="brand-icon">P</span>Trackspave</a>
    <p class="eyebrow">APP PREVIEW</p>
    <h1>Get started</h1>
    <p class="intro">Create a preview account to explore Trackspave.</p>

    <form class="demo-form">
      <label for="name">Name</label>
      <input id="name" type="text" placeholder="Your name" required>

      <label for="email">Email</label>
      <input id="email" type="email" placeholder="you@example.com" required>

      <label for="password">Password</label>
      <input id="password" type="password" placeholder="Create a password" required>

      <button class="button full-button" type="submit">Create account</button>
      <p class="form-message" role="status"></p>
    </form>

    <p class="account-switch">Already have an account? <a href="signin.html">Sign in</a></p>
    <p class="disclaimer">Preview only. This form does not create an account or send your details.</p>
  </main>
</body>
</html>
